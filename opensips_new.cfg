####### Global Parameters #########
#
# Simple version: no trunk-specific logic.
# Every initial INVITE goes to the Asterisk cluster through the dispatcher.
# RTPengine rewrites the SDP so media always uses OpenSIPS's own IP.
#
# Toggle: comment the next line out (add one more #) to disable RTPengine
# completely (OpenSIPS then never touches the SDP).
#
#define USE_RTPENGINE

log_level=3
xlog_level=3
stderror_enabled=no
syslog_enabled=yes
syslog_facility=LOG_LOCAL0

udp_workers=4

socket=udp:172.17.22.208:5060

user_agent_header="User-Agent: iftas"
server_header="Server: iftas"


####### Modules Section ########

mpath="/usr/lib64/opensips/modules"

loadmodule "sipmsgops.so"
loadmodule "signaling.so"

loadmodule "proto_udp.so"

loadmodule "sl.so"

loadmodule "tm.so"
modparam("tm", "fr_timeout", 30)
modparam("tm", "fr_inv_timeout", 60)
modparam("tm", "restart_fr_on_each_reply", 0)
modparam("tm", "onreply_avp_mode", 1)

loadmodule "rr.so"
modparam("rr", "enable_double_rr", 1)
modparam("rr", "append_fromtag", 1)

loadmodule "db_mysql.so"

loadmodule "dispatcher.so"
modparam("dispatcher", "db_url", "mysql://opensips:opensipsrw@localhost/opensips")
modparam("dispatcher", "ds_ping_from", "sip:pinger@172.17.22.208")
modparam("dispatcher", "ds_ping_interval", 20)
modparam("dispatcher", "ds_probing_mode", 1)
modparam("dispatcher", "ds_ping_method", "OPTIONS")
modparam("dispatcher", "ds_probing_threshold", 2)
modparam("dispatcher", "options_reply_codes", "403, 404")

#ifdef USE_RTPENGINE
loadmodule "rtpengine.so"
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:2223")
#endif

loadmodule "mi_fifo.so"
modparam("mi_fifo", "fifo_name", "/var/run/opensips/opensips_fifo")

loadmodule "maxfwd.so"


####### Routing Logic ########

route {

    xlog("L_INFO", "INFO: Enter script. [$ci] [$rm] +++ [$si:$sp] rU [$rU] fU [$fU]");

    t_check_trans();

    route(REQINIT);
    route(WITHINDIALOG);

    if (is_method("CANCEL")) {
        route(PROCESS_CANCEL);
        exit;
    }

    if (is_method("ACK")) {
        route(PROCESS_ACK);
        exit;
    }

    if (is_method("OPTIONS|INFO")) {
        route(PROCESS_OPTIONS);
        exit;
    }

    if (is_method("MESSAGE|PUBLISH|SUBSCRIBE")) {
        send_reply(501, "Method is Not Implemented");
        exit;
    }

    if (!is_method("INVITE")) {
        send_reply(405, "Method Not Allowed");
        exit;
    }

    record_route();

    route(DISPATCH);
    route(RELAY);
}

route[PROCESS_CANCEL] {
#ifdef USE_RTPENGINE
    rtpengine_delete();
#endif
    route(CHECK_TRANSACTION);
}

route[PROCESS_ACK] {
    route(CHECK_TRANSACTION);
}

route[PROCESS_OPTIONS] {
    send_reply(200, "OK");
    exit;
}

route[CHECK_TRANSACTION] {
    if (t_check_trans()) {
        t_relay();
    }
    exit;
}

route[REQINIT] {
    if (!mf_process_maxfwd_header(10)) {
        sl_send_reply(483, "Too Many Hops");
        exit;
    }
}

# Offer to RTPengine: rewrites SDP (o=, c=, m= port) to OpenSIPS's own IP
route[MEDIA_OFFER] {
#ifdef USE_RTPENGINE
    if (!has_body("application/sdp")) {
        return;
    }
    if (!rtpengine_offer("replace-origin replace-session-connection ICE=remove")) {
        xlog("L_ERR", "[$ci] rtpengine_offer FAILED - SDP left unchanged!\n");
    } else {
        xlog("L_INFO", "[$ci] rtpengine_offer OK\n");
    }
#endif
}

route[WITHINDIALOG] {
    if (has_totag() && is_method("INVITE|ACK|BYE|UPDATE|REFER|PRACK|INFO|NOTIFY|OPTIONS")) {

        if (loose_route()) {
            xlog("L_INFO", "In-dialog [$rm] routed via Record-Route");

#ifdef USE_RTPENGINE
            if (is_method("BYE")) {
                rtpengine_delete();
            }
#endif

            # re-INVITE / UPDATE carrying SDP (hold, codec change, etc.)
            if (is_method("INVITE|UPDATE")) {
                route(MEDIA_OFFER);
                t_on_reply("MEDIA_REPLY");
            }

            route(RELAY);
        }

        if (is_method("ACK") && t_check_trans()) {
            t_relay();
            exit;
        }

        sl_send_reply(404, "Not here");
        exit;
    }
}

route[DISPATCH] {
    # setid=1, algorithm 4 = weighted round-robin, flag 'f' = failover
    if (!ds_select_dst(1, 4, "f")) {
        xlog("L_ERR", "No active Asterisk destination for [$ci]");
        send_reply(503, "Service Unavailable");
        exit;
    }

    t_on_failure("DS_FAILOVER");

    route(MEDIA_OFFER);
    t_on_reply("MEDIA_REPLY");
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

# Answer: rewrites the SDP in the reply so media goes back through RTPengine
onreply_route[MEDIA_REPLY] {
#ifdef USE_RTPENGINE
    if (has_body("application/sdp") && ($rs == 180 || $rs == 183 || $rs == 200)) {
        if (!rtpengine_answer("replace-origin replace-session-connection ICE=remove")) {
            xlog("L_ERR", "[$ci] rtpengine_answer FAILED - SDP left unchanged!\n");
        } else {
            xlog("L_INFO", "[$ci] rtpengine_answer OK ($rs)\n");
        }
    }
#endif
}

failure_route[DS_FAILOVER] {
    if (t_was_cancelled()) {
        exit;
    }

    if (ds_next_dst()) {
        route(MEDIA_OFFER);
        t_on_failure("DS_FAILOVER");
        t_relay();
        exit;
    }

#ifdef USE_RTPENGINE
    rtpengine_delete();
#endif
    send_reply(503, "Service Unavailable");
}
